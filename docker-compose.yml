name: open_code_vps

services:
  opencode:
    build:
      context: .
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
    image: open_code_vps:${OPENCODE_VERSION:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    expose:
      - "4096"
    environment:
      HOME: /root
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD in .env or in the Coolify environment}
      OPENCODE_DISABLE_AUTOUPDATE: "true"
    volumes:
      - opencode-data:/root/.local/share/opencode
      - opencode-state:/root/.local/state/opencode
      - opencode-cache:/root/.cache/opencode
      - opencode-config:/root/.config/opencode
      - workspace:/workspace
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -u "$${OPENCODE_SERVER_USERNAME}:$${OPENCODE_SERVER_PASSWORD}"
          http://127.0.0.1:4096/global/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  opencode-data:
  opencode-state:
  opencode-cache:
  opencode-config:
  workspace:
